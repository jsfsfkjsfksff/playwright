# provider 连接信息。
# api_key 不写在这里，只写"从哪个环境变量读"。
# 加 provider = 加一段配置 + 加一个环境变量，代码不动。

providers:
  dashscope:
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY
    timeout: 60

  # AIGC Galgame 世界线生成：阿里云百炼 MaaS 私有端点（与 Java 端原配置一致）
  aliyun_maas:
    base_url: https://llm-o8qpzz9kqn1xy3rg.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
    api_key_env: ALIYUN_MAAS_API_KEY
    timeout: 60

  deepseek:
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    timeout: 60

  openai:
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    timeout: 60

