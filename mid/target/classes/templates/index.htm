<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>AI 叙事 IDE - 插值引擎</title>
    <style>
        body { font-family: 'Microsoft YaHei', sans-serif; display: flex; gap: 20px; padding: 20px; background: #2d2d2d; color: #fff; }
        .panel { background: #3c3f41; padding: 20px; border-radius: 8px; flex: 1; border: 1px solid #555; }
        .node-box { background: #2b2d30; border-left: 4px solid #4CAF50; padding: 10px; margin-bottom: 10px; font-size: 0.9em; }
        input, button { padding: 8px; margin-top: 10px; border-radius: 4px; border: 1px solid #666; background: #555; color: white; width: 100%; box-sizing: border-box; }
        button { background: #4a88c7; cursor: pointer; border: none; font-weight: bold; }
        button:hover { background: #3573b0; }
        .ai-result { background: #2b2d30; border-left: 4px solid #e2c08d; padding: 10px; margin-top: 15px; color: #e2c08d; }
    </style>
</head>
<body>
<!-- 左侧：创作者预设的锚点 -->
<div class="panel">
    <h3>📍 创作者锚点空间</h3>
    <div class="node-box" id="node-start">
        <strong>起点 (SCENE_A):</strong> 夏日祭的夜晚，你在神社后山迷路了，遇到了神秘少女。
    </div>
    <div class="node-box" id="node-end" style="border-color: #f44336;">
        <strong>终点 (SCENE_B):</strong> 少女的长剑架在了你的脖子上，眼神冰冷。
    </div>
</div>

<!-- 右侧：AI 插值控制台 -->
<div class="panel">
    <h3>⚡ AI 状态插值器 (A ➡️ B)</h3>
    <p style="font-size: 0.8em; color: #aaa;">设定大纲，让 AI 自动补全从 A 到 B 的剧情和状态转移：</p>

    <input type="hidden" id="startId" value="SCENE_A">
    <input type="hidden" id="endId" value="SCENE_B">
    <input type="text" id="outlineInput" placeholder="输入大纲约束，例如：男主试图搭讪，但说错了话激怒了对方">

    <button onclick="runInterpolation()">执行定向插值推演</button>

    <div id="result-box"></div>
</div>

<script>
    async function runInterpolation() {
        const resultBox = document.getElementById('result-box');
        resultBox.innerHTML = "<p>🔄 引擎高维演算中...</p>";

        const payload = {
            startSceneId: document.getElementById('startId').value,
            endSceneId: document.getElementById('endId').value,
            outline: document.getElementById('outlineInput').value
        };

        const response = await fetch('/api/studio/interpolate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const bridgeNode = await response.json();

        resultBox.innerHTML = `
                <div class="ai-result">
                    <strong>✨ 插值成功！生成过渡节点 (${bridgeNode.sceneId}):</strong><br><br>
                    ${bridgeNode.text}
                    <br><br>
                    <small>🔗 图谱已缝合：SCENE_A ➡️ AI_BRIDGE ➡️ SCENE_B</small>
                </div>
            `;
    }
</script>
</body>
</html>
