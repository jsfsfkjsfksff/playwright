spring.application.name=aigc-gal
spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${NEO4J_USERNAME:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:}

# ===== 统一媒体服务（契约「服务地址与音频文件存储约定」）=====
# 规矩一：所有 audioUrl 都必须由 media.base-url + 相对路径拼出来，
#         不能一部分指向 Java 的 8080、另一部分指向 Python 的 8000。
media.base-url=${MEDIA_BASE_URL:http://localhost:8000}
# 规矩二：Java 与 Python 必须读写同一份媒体文件（共享目录 / 共享卷）。
#         Java 上传的 BGM 写这里，Python 生成的场景人声也写这里。
#         待负责 BGM / 播放 / 导出三块的人填入真实路径。
media.root=${MEDIA_ROOT:}

# Python 音频服务（TTS / 混音）地址
python.base-url=${PYTHON_BASE_URL:http://localhost:8000}

ai.api.url=${AI_API_URL:https://llm-o8qpzz9kqn1xy3rg.cn-beijing.maas.aliyuncs.com/compatible-mode/v1/chat/completions}
ai.api.key=${AI_API_KEY:}
ai.api.model=${AI_API_MODEL:qwen3.8-flash}
